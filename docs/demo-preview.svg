        <rect x="122" y="112" width="102" height="18" rx="4" fill="rgba(16,185,129,0.1)"/>
        <text x="173" y="125" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Cache Invalidation</text>

        <rect x="16" y="140" width="208" height="38" rx="4" fill="#0d121c" stroke="#f38020" stroke-width="0.8"/>
        <text x="24" y="157" font-family="sans-serif" font-size="10" fill="#94a3b8">💡 Relational persistence in Cloudflare D1</text>
        <text x="24" y="170" font-family="sans-serif" font-size="9" fill="#64748b">Synced across Durable Objects and SQLite</text>
      </g>
    </g>

    <g transform="translate(300, 68)">
      <g transform="translate(0, 10)">
        <rect width="32" height="32" rx="8" fill="url(#orange-grad)"/>
        <text x="16" y="21" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">⚡</text>
        <rect x="44" y="0" width="660" height="88" rx="12" fill="#182030" stroke="#26334d"/>
        <text x="60" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f38020">AI INTERVIEWER</text>
        <text x="60" y="44" font-family="sans-serif" font-size="13" fill="#f1f5f9">How would you design a distributed cache with high read throughput?</text>
        <text x="60" y="66" font-family="sans-serif" font-size="13" fill="#94a3b8">Specifically consider replication, write strategies, and handling the thundering herd problem.</text>
      </g>

      <g transform="translate(90, 115)">
        <rect x="0" y="0" width="580" height="95" rx="12" fill="#2563eb"/>
        <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bfdbfe">YOU (CANDIDATE)</text>
        <text x="20" y="46" font-family="sans-serif" font-size="13" fill="#fff">I would use a cluster of Redis nodes with consistent hashing for distribution.</text>
        <text x="20" y="66" font-family="sans-serif" font-size="13" fill="#fff">For high throughput, I deploy read replicas with a cache-aside pattern, and use</text>
        <text x="20" y="86" font-family="sans-serif" font-size="13" fill="#fff">single-flight request collapsing or mutex locks on cache misses to prevent stampedes.</text>
        <rect x="590" y="0" width="32" height="32" rx="8" fill="#3b82f6"/>
        <text x="606" y="21" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle">👤</text>
      </g>

      <g transform="translate(0, 275)">
        <rect width="710" height="70" rx="14" fill="#182030" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="20" y="32" font-family="sans-serif" font-size="13" fill="#f1f5f9">Type your answer or tap the mic for real-time speech-to-text…</text>
        <text x="20" y="54" font-family="sans-serif" font-size="11" fill="#64748b">Press Enter to send · Shift+Enter for new line · Streaming from Llama 3.3 70B</text>
        <circle cx="640" cy="35" r="16" fill="#1e293b" stroke="#334155"/>
        <text x="640" y="40" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">🎙️</text>
        <circle cx="680" cy="35" r="16" fill="url(#orange-grad)"/>
        <text x="680" y="39" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">➤</text>
      </g>
