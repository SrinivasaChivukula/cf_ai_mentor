<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0b0f17"/>
  <defs>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38020" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38020"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <g transform="translate(80, 45)">
    <rect width="44" height="44" rx="12" fill="url(#orange-grad)"/>
    <text x="22" y="28" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">⚡</text>
    <text x="60" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f1f5f9">Cloudflare AI Mentor</text>
    
    <rect x="360" y="10" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
    <circle cx="376" cy="23" r="4" fill="#10b981"/>
    <text x="388" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Llama 3.3 70B</text>

    <rect x="500" y="10" width="125" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
    <text x="562" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">React 19 + Vite</text>

    <rect x="635" y="10" width="145" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
