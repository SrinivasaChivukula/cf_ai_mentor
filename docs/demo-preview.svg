  </g>

  <g transform="translate(80, 105)">
    <rect width="1040" height="480" rx="16" fill="#131924" stroke="#26334d" stroke-width="1.5"/>
    <path d="M0 16C0 7.16 7.16 0 16 0H1024C1032.84 0 1040 7.16 1040 16V48H0V16Z" fill="#182030" stroke="#26334d" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ef4444"/>
    <circle cx="44" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="24" r="6" fill="#10b981"/>
    <text x="520" y="28" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">https://cf-ai-mentor.dev — Mock Technical Interview Platform</text>

    <rect x="0" y="48" width="280" height="432" fill="#101520" stroke="#26334d" stroke-width="1"/>
    
    <g transform="translate(20, 68)">
      <rect width="240" height="95" rx="10" fill="#182030" stroke="#26334d"/>
      <text x="16" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">CURRENT SESSION</text>
      <text x="16" y="46" font-family="sans-serif" font-size="12" fill="#94a3b8">Topic: <tspan font-weight="bold" fill="#f1f5f9">System Design</tspan></text>
      <text x="16" y="66" font-family="sans-serif" font-size="12" fill="#94a3b8">Difficulty: <tspan font-weight="bold" fill="#f59e0b">Hard</tspan></text>
      <text x="16" y="86" font-family="sans-serif" font-size="12" fill="#94a3b8">Messages: <tspan font-weight="bold" fill="#f1f5f9">6</tspan></text>

      <g transform="translate(0, 110)">
        <rect width="240" height="190" rx="10" fill="#182030" stroke="#f38020" stroke-width="1.2"/>
        <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#f38020">DEEP ANALYSIS (WORKFLOW)</text>
        
        <text x="16" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Communication</text>
        <rect x="175" y="37" width="48" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
        <text x="199" y="50" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">9/10</text>

        <text x="16" y="76" font-family="sans-serif" font-size="12" fill="#94a3b8">Technical Accuracy</text>
        <rect x="175" y="63" width="48" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
        <text x="199" y="76" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">8/10</text>

        <text x="16" y="104" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b">STRENGTHS</text>
        <rect x="16" y="112" width="100" height="18" rx="4" fill="rgba(16,185,129,0.1)"/>
